        // Application Store
        let state = { ...INITIAL_DATA };

        function loadFromStorage() {
            const savedData = localStorage.getItem('pcc_lab_system_data');
            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    state.units = parsed.units || INITIAL_DATA.units;
                    state.users = parsed.users || INITIAL_DATA.users;
                    state.reports = parsed.reports || INITIAL_DATA.reports;
                } catch (e) {
                    console.error('Failed to parse localStorage data', e);
                }
            }
        }

        function saveToStorage() {
            localStorage.setItem('pcc_lab_system_data', JSON.stringify({
                units: state.units,
                users: state.users,
                reports: state.reports
            }));
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-800' : type === 'danger' ? 'bg-rose-800' : 'bg-slate-800';
            toast.className = `pointer-events-auto ${bg} text-white px-4 py-3 rounded-xl shadow-lg border border-white/20 text-sm font-medium flex items-center justify-between gap-3 transform transition-all duration-300 translate-y-2 opacity-0`;
            
            let icon = 'fa-check-circle';
            if (type === 'danger') icon = 'fa-exclamation-circle';
            if (type === 'info') icon = 'fa-info-circle';

            toast.innerHTML = `
                <div class="flex items-center gap-2">
                    <i class="fas ${icon}"></i>
                    <span>${message}</span>
                </div>
                <button onclick="this.parentElement.remove()" class="text-white/60 hover:text-white"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function render() {
            const app = document.getElementById('app');
            
            if (state.currentScreen === 'welcome') {
                app.innerHTML = renderWelcomeScreen();
            } else if (state.currentScreen === 'login') {
                app.innerHTML = renderLoginScreen();
            } else if (state.currentScreen === 'resetPassword') {
                app.innerHTML = renderResetPasswordScreen();
            } else {
                app.innerHTML = renderMainDashboardLayout();
                attachMainEvents();
            }
        }

        function renderNavItem(tabId, icon, label) {

                    <i class="${icon} text-sm w-5 text-center"></i>
                    <span>${label}</span>
                </button>
            `;
        }

        // --- HELPER COMPONENT: BADGES ---
        function renderStatusBadge(status) {
            let colors = 'bg-slate-100 text-slate-600';
            let icon = 'fa-circle';

            switch(status) {
                case 'AVAILABLE':
                case 'COMPLETED':
                case 'ACTIVE':
                    colors = 'bg-emerald-100 text-emerald-800 border-emerald-200';
                    break;
                case 'IN USE':
                case 'IN PROGRESS':
                    colors = 'bg-sky-100 text-sky-800 border-sky-200';
                    break;
                case 'MAINTENANCE':
                case 'PENDING':
                    colors = 'bg-amber-100 text-amber-800 border-amber-200';
                    break;
                case 'INACTIVE':
                    colors = 'bg-rose-100 text-rose-800 border-rose-200';
                    break;
            }

            return `
                <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-bold border ${colors}">
                    <span class="w-1.5 h-1.5 rounded-full bg-current"></span>
                    ${status}
                </span>
            `;
        }

        function openUnitModal(unitId = null) {

            const unit = isEdit ? state.units.find(u => u.id === unitId) : { id: `PC-0${state.units.length + 1}`, lab: 'Lab A, Station 1', model: 'Dell OptiPlex 7080', cpu: 'Core i7 10th', ram: '16GB DDR4', storage: '512GB SSD', gpu: 'RTX 3060', status: 'AVAILABLE' };

            const modalHtml = `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-200">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-4">
                            <h3 class="text-base font-bold text-slate-800">${isEdit ? 'Edit Workstation' : 'Add New Computer Unit'}</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
                        </div>

                        <form onsubmit="handleSaveUnit(event, '${isEdit ? unit.id : ''}')" class="space-y-3">
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-600 mb-1">Unit ID</label>
                                    <input type="text" id="m_unitId" required value="${unit.id}" ${isEdit ? 'readonly class="w-full px-3 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs font-semibold"' : 'class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs"'}>
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-600 mb-1">Status</label>
                                    <select id="m_unitStatus" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs">
                                        <option value="AVAILABLE" ${unit.status === 'AVAILABLE' ? 'selected' : ''}>AVAILABLE</option>
                                        <option value="IN USE" ${unit.status === 'IN USE' ? 'selected' : ''}>IN USE</option>
                                        <option value="MAINTENANCE" ${unit.status === 'MAINTENANCE' ? 'selected' : ''}>MAINTENANCE</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-600 mb-1">Model Name</label>
                                <input type="text" id="m_unitModel" required value="${unit.model}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs">
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-600 mb-1">Lab / Station Assignment</label>
                                <input type="text" id="m_unitLab" required value="${unit.lab}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs">
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-600 mb-1">CPU</label>
                                    <input type="text" id="m_unitCpu" value="${unit.cpu}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-600 mb-1">RAM</label>
                                    <input type="text" id="m_unitRam" value="${unit.ram}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs">
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-600 mb-1">Storage</label>
                                    <input type="text" id="m_unitStorage" value="${unit.storage}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-600 mb-1">GPU</label>
                                    <input type="text" id="m_unitGpu" value="${unit.gpu}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs">
                                </div>
                            </div>

                            <div class="flex justify-end gap-2 pt-4">
                                <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 rounded-xl text-xs font-semibold">Cancel</button>
                                <button type="submit" class="px-4 py-2 bg-brand-800 text-white rounded-xl text-xs font-semibold">Save Unit</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').innerHTML = modalHtml;
        }

        function handleSaveUnit(event, existingId) {
            event.preventDefault();
            const newUnit = {
                id: document.getElementById('m_unitId').value.trim(),
                status: document.getElementById('m_unitStatus').value,
                model: document.getElementById('m_unitModel').value.trim(),
                lab: document.getElementById('m_unitLab').value.trim(),
                cpu: document.getElementById('m_unitCpu').value.trim(),
                ram: document.getElementById('m_unitRam').value.trim(),
                storage: document.getElementById('m_unitStorage').value.trim(),
                gpu: document.getElementById('m_unitGpu').value.trim()
            };

            if (existingId) {
                const idx = state.units.findIndex(u => u.id === existingId);
                if (idx !== -1) state.units[idx] = newUnit;
                showToast(`Updated workstation ${newUnit.id}`, 'success');
            } else {
                state.units.unshift(newUnit);
                showToast(`Created new workstation ${newUnit.id}`, 'success');
            }

            saveToStorage();
            closeModal();
            render();
        }

        function deleteUnit(unitId) {
            if (confirm(`Are you sure you want to delete ${unitId}?`)) {
                state.units = state.units.filter(u => u.id !== unitId);
                saveToStorage();
                showToast(`Deleted unit ${unitId}`, 'danger');
                render();
            }
        }

        function toggleUnitStatus(unitId) {
            const unit = state.units.find(u => u.id === unitId);
            if (unit) {
                if (unit.status === 'AVAILABLE') unit.status = 'IN USE';
                else if (unit.status === 'IN USE') unit.status = 'MAINTENANCE';
                else unit.status = 'AVAILABLE';

                saveToStorage();
                showToast(`Updated ${unitId} to ${unit.status}`, 'info');
                render();
            }
        }

        function openUserModal(userId = null) {
            const isEdit = !!userId;
            const user = isEdit ? state.users.find(u => u.id === userId) : { id: `STU-2023-${Math.floor(100+Math.random()*900)}`, name: '', role: 'Student', email: '', status: 'ACTIVE' };

            const modalHtml = `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-4">
                            <h3 class="text-base font-bold text-slate-800">${isEdit ? 'Edit User Record' : 'Add New System User'}</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
                        </div>

                        <form onsubmit="handleSaveUser(event, '${isEdit ? user.id : ''}')" class="space-y-3">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-600 mb-1">User ID</label>
                                <input type="text" id="m_userId" required value="${user.id}" ${isEdit ? 'readonly class="w-full px-3 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs font-semibold"' : 'class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs"'}>
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-600 mb-1">Full Name</label>
                                <input type="text" id="m_userName" required value="${user.name}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs">
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-600 mb-1">Role</label>
                                    <select id="m_userRole" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs">
                                        <option value="Student" ${user.role === 'Client' ? 'selected' : ''}>Client</option>
                                        <option value="Faculty" ${user.role === 'VIP' ? 'selected' : ''}>Vip</option>
                                        <option value="Admin" ${user.role === 'Admin' ? 'selected' : ''}>Admin</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-600 mb-1">Status</label>
                                    <select id="m_userStatus" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs">
                                        <option value="ACTIVE" ${user.status === 'ACTIVE' ? 'selected' : ''}>ACTIVE</option>
                                        <option value="INACTIVE" ${user.status === 'INACTIVE' ? 'selected' : ''}>INACTIVE</option>
                                        <option value="PENDING" ${user.status === 'PENDING' ? 'selected' : ''}>PENDING</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-600 mb-1">Email Address</label>
                                <input type="email" id="m_userEmail" required value="${user.email}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs">
                            </div>

                            <div class="flex justify-end gap-2 pt-4">
                                <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 rounded-xl text-xs font-semibold">Cancel</button>
                                <button type="submit" class="px-4 py-2 bg-brand-800 text-white rounded-xl text-xs font-semibold">Save User</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').innerHTML = modalHtml;
        }

        function handleSaveUser(event, existingId) {
            event.preventDefault();
            const newUser = {
                id: document.getElementById('m_userId').value.trim(),
                name: document.getElementById('m_userName').value.trim(),
                role: document.getElementById('m_userRole').value,
                status: document.getElementById('m_userStatus').value,
                email: document.getElementById('m_userEmail').value.trim(),
                lastLogin: 'Just now'
            };

            if (existingId) {
                const idx = state.users.findIndex(u => u.id === existingId);
                if (idx !== -1) state.users[idx] = newUser;
                showToast(`Updated user ${newUser.name}`, 'success');
            } else {
                state.users.unshift(newUser);
                showToast(`Added new user ${newUser.name}`, 'success');
            }

            saveToStorage();
            closeModal();
            render();
        }

        function deleteUser(userId) {
            if (confirm(`Are you sure you want to delete user ${userId}?`)) {
                state.users = state.users.filter(u => u.id !== userId);
                saveToStorage();
                showToast(`Deleted user ${userId}`, 'danger');
                render();
            }
        }

        function openReportModal(reportId = null) {
            const isEdit = !!reportId;
            const report = isEdit ? state.reports.find(r => r.id === reportId) : { id: `REP-${Math.floor(100+Math.random()*900)}`, pcId: 'PC-001', lab: 'Lab A, Station 1', problem: '', status: 'PENDING', date: 'Oct 06, 2026', technician: 'Unassigned' };

            const modalHtml = `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-4">
                            <h3 class="text-base font-bold text-slate-800">${isEdit ? 'Edit Maintenance Report' : 'File Maintenance Report'}</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
                        </div>

                        <form onsubmit="handleSaveReport(event, '${isEdit ? report.id : ''}')" class="space-y-3">
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-600 mb-1">Target PC ID</label>
                                    <input type="text" id="m_repPcId" required value="${report.pcId}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-600 mb-1">Status</label>
                                    <select id="m_repStatus" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs">
                                        <option value="PENDING" ${report.status === 'PENDING' ? 'selected' : ''}>PENDING</option>
                                        <option value="IN PROGRESS" ${report.status === 'IN PROGRESS' ? 'selected' : ''}>IN PROGRESS</option>
                                        <option value="COMPLETED" ${report.status === 'COMPLETED' ? 'selected' : ''}>COMPLETED</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-600 mb-1">Problem Description</label>
                                <textarea id="m_repProblem" required class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs h-20">${report.problem}</textarea>
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-600 mb-1">Assigned Technician</label>
                                <input type="text" id="m_repTech" value="${report.technician}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs">
                            </div>

                            <div class="flex justify-end gap-2 pt-4">
                                <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 rounded-xl text-xs font-semibold">Cancel</button>
                                <button type="submit" class="px-4 py-2 bg-brand-800 text-white rounded-xl text-xs font-semibold">Save Report</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').innerHTML = modalHtml;
        }

        function handleSaveReport(event, existingId) {
            event.preventDefault();
            const newReport = {
                id: existingId || `REP-${Math.floor(100+Math.random()*900)}`,
                pcId: document.getElementById('m_repPcId').value.trim(),
                lab: 'Lab A, Station',
                problem: document.getElementById('m_repProblem').value.trim(),
                status: document.getElementById('m_repStatus').value,
                date: 'Oct 06, 2026',
                technician: document.getElementById('m_repTech').value.trim() || 'Unassigned'
            };

            if (existingId) {
                const idx = state.reports.findIndex(r => r.id === existingId);
                if (idx !== -1) state.reports[idx] = newReport;
                showToast(`Updated report ${newReport.id}`, 'success');
            } else {
                state.reports.unshift(newReport);
                showToast(`Submitted report ${newReport.id}`, 'success');
            }

            saveToStorage();
            closeModal();
            render();
        }

        function deleteReport(reportId) {
            if (confirm(`Are you sure you want to delete report ${reportId}?`)) {
                state.reports = state.reports.filter(r => r.id !== reportId);
                saveToStorage();
                showToast(`Deleted report ${reportId}`, 'danger');
                render();
            }
        }

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
        }

        function resetDataToDefault() {
            if (confirm('Reset system data back to initial Figma mockup defaults?')) {
                localStorage.removeItem('pcc_lab_system_data');
                state.units = [ ...INITIAL_DATA.units ];
                state.users = [ ...INITIAL_DATA.users ];
                state.reports = [ ...INITIAL_DATA.reports ];
                showToast('System reset to default state', 'info');
                render();
            }
        }

        function navigateScreen(screenName) {
            state.currentScreen = screenName;
            render();
        }

        function switchTab(tabId) {
            state.activeTab = tabId;
            render();
        }

        function handleLogin(e) {
            e.preventDefault();
            state.userAuth.isLoggedIn = true;
            state.currentScreen = 'app';
            showToast('Signed in successfully', 'success');
            render();
        }

        function handleResetPassword(e) {
            e.preventDefault();
            showToast('Reset link sent to administrator email', 'info');
            state.currentScreen = 'login';
            render();
        }

        function handleLogout() {
            state.userAuth.isLoggedIn = false;
            state.currentScreen = 'welcome';
            showToast('Logged out of workspace', 'info');
            render();
        }

        function handleSearch(val) {
            state.searchTerm = val;
            render();
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('loginPassword');
            const icon = document.getElementById('passwordToggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        function attachMainEvents() {}

        // App Initialization
        window.onload = function() {
            loadFromStorage();
            render();
        };
    </script>
</body>
</html>
